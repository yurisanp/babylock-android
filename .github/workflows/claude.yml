name: Claude

# Responde quando alguém escreve @claude em uma issue, comentário ou PR.
# Usa o limite do plano do Yuri (Pro/Max), não a API paga.
#
# Antes de funcionar:
#   1. Instalar o app do Claude no GitHub: https://github.com/apps/claude
#   2. No computador, rodar `claude setup-token` e salvar o token em
#      Settings > Secrets and variables > Actions > New repository secret
#      com o nome CLAUDE_CODE_OAUTH_TOKEN.
#
# O repositório é público, então só o dono (yurisanp) consegue acionar o Claude.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    if: |
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && github.event.comment.user.login == github.repository_owner) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && github.event.comment.user.login == github.repository_owner) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && github.event.review.user.login == github.repository_owner) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) && github.event.sender.login == github.repository_owner)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Rodar o Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Deixa o Claude ver o resultado do CI nos PRs.
          additional_permissions: |
            actions: read
