name: Vídeo da acessibilidade

# Grava, no emulador, o vídeo que a Play pede no formulário "Serviços de acessibilidade":
# aviso em destaque, aceite, ligar nas configurações e o bloqueio funcionando.
# O resultado sai no artefato "video-acessibilidade" (inglês e português).
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/video.yml"
      - ".github/scripts/accessibility_video.sh"
      - "app/src/androidTest/java/app/babylock/AccessibilityVideo.kt"

jobs:
  video:
    name: Gravar o vídeo da acessibilidade
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Liberar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Compilar antes de ligar o emulador
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest

      - name: Gravar (Android 14, 1080x1920)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/scripts/accessibility_video.sh

      - name: Publicar o vídeo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-acessibilidade
          path: app/build/accessibility-video/
          if-no-files-found: warn
