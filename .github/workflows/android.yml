name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, lint e testes na JVM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK de teste
        run: ./gradlew --no-daemon assembleDebug

      - name: Compilar versão da Play (R8 + lint de release, sem assinatura)
        run: ./gradlew --no-daemon bundleRelease assembleRelease

      - name: Testes de unidade e de tela (Robolectric)
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Cobertura de testes (Kover)
        if: always()
        run: ./gradlew --no-daemon koverXmlReportDebug koverHtmlReportDebug koverLogDebug

      - name: Lint
        if: always()
        run: ./gradlew --no-daemon lintDebug

      - name: Resumo dos testes
        if: always()
        run: python3 .github/scripts/test_summary.py "Testes na JVM" app/build/test-results/testDebugUnitTest >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: babylock-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publicar relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-jvm
          path: |
            app/build/reports/tests/
            app/build/reports/kover/
            app/build/reports/lint-results-debug.html

  emulator:
    name: Testes no emulador (ponta a ponta)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [30, 34]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Liberar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Compilar antes de ligar o emulador
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest

      - name: Rodar testes no emulador (API ${{ matrix.api-level }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: ./gradlew --no-daemon connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.notClass=app.babylock.PlayScreenshots

      - name: Resumo dos testes
        if: always()
        run: python3 .github/scripts/test_summary.py "Emulador API ${{ matrix.api-level }}" app/build/outputs/androidTest-results/connected >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-emulador-api-${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/

  screenshots:
    name: Capturas para a Play (3 idiomas)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Liberar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Compilar antes de ligar o emulador
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest

      - name: Tirar as capturas (Android 14, 1080x1920)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/scripts/play_screenshots.sh

      - name: Publicar as capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-play
          path: app/build/play-screenshots/
          if-no-files-found: warn
