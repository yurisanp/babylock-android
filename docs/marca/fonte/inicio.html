<style>
body{margin:0}
a{color:#2E3A6E}a:hover{color:#121833}
.bl-pulse{animation:bl-pulse 2.4s ease-out infinite}
@keyframes bl-pulse{0%{box-shadow:0 0 0 0 rgba(91,200,168,.6)}70%{box-shadow:0 0 0 8px rgba(91,200,168,0)}100%{box-shadow:0 0 0 0 rgba(91,200,168,0)}}
.bl-breathe{animation:bl-breathe 3.6s cubic-bezier(.45,0,.55,1) infinite}
@keyframes bl-breathe{0%,100%{transform:scale(1);opacity:.35}50%{transform:scale(1.12);opacity:.12}}
.bl-breathe2{animation:bl-breathe 3.6s cubic-bezier(.45,0,.55,1) 1.2s infinite}
.bl-lockbtn{transition:transform 220ms cubic-bezier(.34,1.56,.64,1)}
.bl-lockbtn:hover{transform:scale(1.03)}
.bl-lockbtn:active{transform:scale(.94)}
.bl-lockbtn:focus-visible{outline:3px solid #C9BEF5;outline-offset:6px}
.bl-rise{animation:bl-rise 600ms cubic-bezier(.2,0,0,1) both}
@keyframes bl-rise{from{opacity:0;transform:translateY(22px) scale(.98)}to{opacity:1;transform:none}}
.bl-tile{transition:transform 180ms cubic-bezier(.2,0,0,1),background-color 200ms ease}
.bl-tile:hover{background-color:#FFFFFF}
.bl-tile:active{transform:scale(.95)}
.bl-tile:focus-visible{outline:3px solid #9C8CD9;outline-offset:2px}
.bl-demo-ring{animation:bl-ring 3.4s cubic-bezier(.4,0,.2,1) infinite}
@keyframes bl-ring{0%,8%{stroke-dashoffset:88}80%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
.bl-demo-finger{animation:bl-finger 3.4s ease-in-out infinite}
@keyframes bl-finger{0%{opacity:0;transform:scale(1.4)}8%{opacity:1;transform:scale(1)}85%{opacity:1}100%{opacity:0}}
</style>
